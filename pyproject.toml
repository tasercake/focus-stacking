[project]
name = "bokehforge"
version = "0.1.0"
description = "A measurement-first workbench for sharp focus stacks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.3.30",
  "rawpy>=0.24,<0.27",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "libarchive-c>=5.1,<6",
  "coverage>=7.17.3",
  "openexr>=3.5.4",
  "pypng>=0.20220715.0",
  "scipy>=1.18.1"
]

[project.scripts]
bokehforge = "bokehforge.cli:main"
stack-conformance = "stack_conformance:main"

[project.optional-dependencies]
chimpstackr = [
    "chimpstackr",
    # This official immutable snapshot bundles Qt 6.12.1's native AX ownership fix.
    # ChimpStackr's source and declared dependency range stay unchanged.
    "pyside6-essentials @ https://download.qt.io/snapshots/ci/pyside/6.12/b920c23932946fddc7bb8969f221dd7cf1d7a8d4/pyside6/pyside6_essentials-6.12.0a1.dev1794566397-cp310-abi3-macosx_14_0_universal2.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "shiboken6 @ https://download.qt.io/snapshots/ci/pyside/6.12/b920c23932946fddc7bb8969f221dd7cf1d7a8d4/pyside6/shiboken6-6.12.0a1.dev1794566397-cp310-abi3-macosx_14_0_universal2.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bokehforge", "stack_conformance"]

[tool.uv.workspace]
members = [
    "submodules/ChimpStackr",
]

[tool.uv.sources]
chimpstackr = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"
# This added lint policy applies to conformance code, not existing data tooling.
extend-exclude = ["src/bokehforge", "tests/data", "tests/test_cli.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
