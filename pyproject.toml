[project]
name = "stack-conformance"
version = "0.1.0"
description = "External native-app and numerical conformance suite for focus stacking implementations"
readme = "README.md"
authors = [
    { name = "Krishna Penukonda", email = "krishna@penukonda.me" }
]
requires-python = ">=3.12"
dependencies = [
    "coverage>=7.17.3",
    "imagecodecs>=2026.11.11",
    "numpy>=2.5.4",
    "openexr>=3.5.4",
    "pillow>=13.0.0",
    "pypng>=0.20220715.0",
    "scipy>=1.18.1",
    "tifffile>=2026.11.12",
]

[project.scripts]
stack-conformance = "stack_conformance:main"

[project.optional-dependencies]
chimpstackr = [
    "chimpstackr",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "submodules/ChimpStackr",
]

[tool.uv.sources]
chimpstackr = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
