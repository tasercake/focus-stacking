name: Pancake conformance
on:
  push:
    paths: ['pancake-conformance/**', '.github/workflows/pancake-conformance.yml']
  pull_request:
    paths: ['pancake-conformance/**', '.github/workflows/pancake-conformance.yml']
  workflow_dispatch:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - run: git submodule update --init submodules/ChimpStackr
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool x11-utils dbus-x11 python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core ocl-icd-libopencl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Locked runtime
        run: uv sync --locked --project pancake-conformance/src/pancake_conformance/adapters/chimpstackr_reference
      - name: Unit and adapter regressions
        working-directory: pancake-conformance
        run: uv run --locked --project src/pancake_conformance/adapters/chimpstackr_reference pytest tests src/pancake_conformance/adapters/tests
      - name: Lint
        working-directory: pancake-conformance
        run: uv run --locked --project src/pancake_conformance/adapters/chimpstackr_reference ruff check src tests
      - name: Linux native GUI smoke
        if: runner.os == 'Linux'
        working-directory: pancake-conformance
        run: |
          mkdir -p artifacts
          uv run --locked --project src/pancake_conformance/adapters/chimpstackr_reference pytest tests/test_interface_cases.py --basetemp artifacts/ci-smoke --gui-desktop --target src/pancake_conformance/adapters/chimpstackr_reference/chimpstackr.toml
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-${{ runner.os }}-diagnostics
          path: pancake-conformance/artifacts/ci-smoke
          if-no-files-found: ignore
