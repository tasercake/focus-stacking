# Pancake application target for the full contract-v2 catalog.
# Unfinished requirements must fail, not disappear as unsupported capabilities.
# Add UI mappings only after observing the actual Slint accessibility tree.
schema_version = 1
name = "pancake-rust"
root = "../../../../../pancake"
cli = ["./target/release/pancake-cli"]
gui = ["./target/release/pancake-gui"]
capabilities = [
  "cli", "cpu", "gpu", "physical_gpu", "native_gui",
  "backend_evidence", "alignment_evidence", "cli_reports", "exclusive_device_flags",
  "png", "jpeg", "tiff", "exr", "preferences", "about", "lightroom",
  "layout_panels", "advanced_controls", "recent_folders", "batch_export",
  "source_context", "viewport_export", "retained_results", "manual_crop",
  "pause_resume", "gpu_preference",
]

[state]
compute_cache = "{home}/device-cache"

[env]
PANCAKE_STATE_DIR = "{home}"
PANCAKE_COMPUTE_CACHE_DIR = "{home}/device-cache"
PANCAKE_DEFAULT_DEVICE = "cpu"

[stack]
input = ["--input", "{inputs}"]
output = ["--output", "{output}"]

[stack.defaults]
device = "cpu"
kernel_size = 3
pyramid_levels = 4
scale_factor = 6

[stack.options]
method = "--method"
align = "--align"
alignment_mode = "--alignment-mode"
alignment_reference = "--alignment-ref"
kernel_size = "--kernel-size"
pyramid_levels = "--pyramid-levels"
scale_factor = "--scale-factor"
max_scale_step = "--max-scale-step"
max_precision = "--max-precision"
slab_size = "--slab-size"
slab_overlap = "--slab-overlap"
auto = "--auto"
auto_crop = "--auto-crop"
quality = "--quality"
quality_report = "--quality-report"
bit_depth = "--bit-depth"
gpu_id = "--gpu-id"
rotation_scale = "--rotation-scale"
device = { cpu = ["--cpu"], gpu = ["--gpu"], auto = ["--device", "auto"] }

[stack.observations]
progress = '(?im)^progress\s+[0-9]+/[0-9]+'
quality_report = '(?im)^sharpness\s+[0-9]+(?:\.[0-9]+)?'

[ui.controls]
"settings.device_mode" = { id = "settings.device" }

[ui.actions]
"advanced.open" = [{ click = "advanced" }, { key = "tab" }]
"frames.select_first" = [{ click = "frame.0" }]
"export.open" = [{ click = "export.start" }]
"window.close" = [{ key = "escape" }, { key = "w", modifiers = ["command"] }]
"frames.context_second" = [{ click = "frame.1", physical = true, button = "right" }]
"results.select.hybrid" = [{ click = { within = { id = "results" }, role = "AXButton", text_pattern = "^Hybrid$" } }]
"results.select.weighted_average" = [{ click = { within = { id = "results" }, role = "AXButton", text_pattern = "^Weighted average$" } }]

[ui.choices]
alignment = { off = "Off", translation = "Translation", euclidean = "Euclidean", similarity = "Similarity", affine = "Affine", breathing = "Breathing" }
"settings.theme" = { light = "Light", dark = "Dark" }
"settings.device_mode" = { auto = "Automatic", cpu = "CPU", gpu = "GPU" }
"export.format" = { png = "PNG", jpg = "JPEG", tif = "TIFF", exr = "OpenEXR" }
"export.depth" = { "8" = "8-bit", "16" = "16-bit" }

[ui.observations]
selected_method = { selected = { laplacian = { id = "method.laplacian" }, hybrid = { id = "method.hybrid" }, weighted_average = { id = "method.weighted_average" }, depth_map = { id = "method.depth_map" }, exposure_fusion = { id = "method.exposure_fusion" } } }
"about.version" = { selector = { id = "about.version" } }
frame_count = { selector = { id = "frames.count" }, pattern = '^(\d+) frames?$', type = "integer" }
source_total = { selector = { id = "frames.count" }, pattern = '^(\d+) frames?$', type = "integer" }
source_index = { selector = { id = "viewer" }, attribute = "description", json = "source_index" }
selected_result_method = { selector = { id = "viewer" }, attribute = "description", json = "result_method" }
result_cropped = { selector = { id = "viewer" }, attribute = "description", json = "cropped" }
result_count = { selector = { id = "results.count" }, type = "integer" }

[ui.advanced_values]
kernel-size = 7

[ui.settings_choices]
"settings.theme" = ["light", "dark"]
"settings.device_mode" = ["cpu", "gpu"]
