schema_version = 1
name = "chimpstackr-python-reference"
root = "../../../../../submodules/ChimpStackr"
adapter = "pancake_conformance.adapters.chimpstackr"
coverage_scope = "chimpstackr-coverage-v2.json"
cli = ["{python}", "-m", "src.cli"]
gui = ["{python}", "-m", "pancake_conformance.adapters.chimpstackr_ui"]
probe = ["{python}", "-m", "pancake_conformance.adapters.chimpstackr_probe"]
capabilities = ["cli", "native_gui", "cpu", "gpu", "backend_evidence", "alignment_evidence", "png", "jpeg", "tiff", "exr", "cli_reports", "exclusive_device_flags", "preferences", "about", "lightroom", "layout_panels", "advanced_controls", "recent_folders", "batch_export", "source_context", "viewport_export", "retained_results", "manual_crop", "pause_resume", "gpu_preference"]

[instrumentation]
source = "src"

[runtime]
project = "."

[gui_vm]
# Bootstrap a dedicated managed guest; existing custom VM names remain configurable.
name = "pancake-conformance"
ssh_user = "admin"
guest_root = "/Users/admin/pancake-conformance"
ssh_identity = "~/.ssh/pancake-conformance"
python = "3.12.14"

[state]
compute_cache = "{home}/device-cache"

[env]
NUMBA_NUM_THREADS = "2"
OMP_NUM_THREADS = "2"
OPENBLAS_NUM_THREADS = "1"
NUMBA_CACHE_DIR = "{run}/compiler-cache"
PYTHONUNBUFFERED = "1"
OPENCV_IO_ENABLE_OPENEXR = "1"
QT_QPA_PLATFORM = "cocoa"
CHIMPSTACKR_CACHE_DIR = "{home}/device-cache"
CF_UI_INITIAL_SETTINGS = '{"computing/gpu_mode":"cpu","computing/use_gpu":0,"computing/gpu_default_on":1,"updates/auto_check":0,"ui/last_dir":"{home}"}'

[stack.defaults]
device = "cpu"
kernel_size = 3
pyramid_levels = 4
scale_factor = 6

[stack]
input = ["--input", "{inputs}"]
output = ["--output", "{output}"]

[stack.options]
method = "--method"
align = "--align"
alignment_mode = "--alignment-mode"
alignment_reference = "--alignment-ref"
kernel_size = "--kernel-size"
pyramid_levels = "--pyramid-levels"
scale_factor = "--scale-factor"
max_scale_step = "--max-scale-step"
max_precision = "--max-precision"
slab_size = "--slab-size"
slab_overlap = "--slab-overlap"
auto = "--auto"
auto_crop = "--auto-crop"
quality = "--quality"
quality_report = "--quality-report"
bit_depth = "--bit-depth"
gpu_id = "--gpu-id"
measure = "--measure"
rotation_scale = "--rotation-scale"
device = { cpu = ["--cpu"], gpu = ["--gpu"], auto = [] }

[stack.observations]
quality_report = '(?i)sharpness[^\n]*[0-9]'
progress = '\[[0-9]+/[0-9]+\]'

[ui.controls]
"open-panel" = { "id" = "open-panel" }
"save-panel" = { "id" = "save-panel" }
"about.open" = { role = "AXMenuItem", title = "About chimpstackr" }
"about.window" = { role = "AXWindow", title = "About ChimpStackr" }
"dialog.error" = { any_of = [{ role = "AXSheet" }, { role = "AXWindow", subrole = "AXDialog" }] }

"import.folder" = { "role" = "AXMenuItem", "title" = "Add Folder\u2026" }
"settings.open" = { "role" = "AXMenuItem", "title" = "Settings\u2026" }
"viewer.fit" = { "role" = "AXMenuItem", "title" = "Zoom to Fit" }
"viewer.actual" = { "role" = "AXMenuItem", "title" = "Actual Size (100 %)" }
"viewer.zoom_in" = { "role" = "AXMenuItem", "title" = "Zoom In" }
"viewer.zoom_out" = { "role" = "AXMenuItem", "title" = "Zoom Out" }
"viewer.fullscreen_enter" = { "role" = "AXMenuItem", "title" = "Enter Full Screen" }
"viewer.fullscreen_exit" = { "role" = "AXMenuItem", "title" = "Exit Full Screen" }
"export.viewport" = { "role" = "AXMenuItem", "title" = "Export Current View\u2026" }
"export.batch" = { "role" = "AXMenuItem", "title" = "Export JPEG, PNG and TIFF\u2026" }
"result.crop" = { "role" = "AXMenuItem", "title" = "Auto-Crop Result" }
"window.close" = { "role" = "AXMenuItem", "title" = "Close Window" }
"layout.sidebar" = { "role" = "AXMenuItem", "title" = "Show Sidebar" }
"layout.inspector" = { "role" = "AXMenuItem", "title" = "Show Inspector" }
"stack.pause" = { "role" = "AXMenuItem", "title" = "Pause" }
"stack.resume" = { "role" = "AXMenuItem", "title" = "Resume" }
"stack.stop" = { "role" = "AXMenuItem", "title" = "Stop" }
"frames.remove_one" = { "role" = "AXMenuItem", "title" = "Remove 1 frame" }
"frames.reveal" = { "role" = "AXMenuItem", "title" = "Show in Finder" }
"frames.select_all" = { "role" = "AXMenuItem", "title" = "Select All Frames" }
"frames.remove_selected" = { "role" = "AXMenuItem", "title" = "Remove Selected Frames" }
"file.menu" = { "role" = "AXMenuBarItem", "title" = "File" }
"recent.open" = { "role" = "AXMenuItem", "title" = "Open Recent" }
"recent.clear" = { "role" = "AXMenuItem", "title" = "Clear Menu" }
"recent.empty" = { "role" = "AXMenuItem", "title" = "No Recent Folders" }
"dialog.close" = { "role" = "AXButton", "title" = "Close" }
"dialog.cancel" = { "role" = "AXButton", "title" = "Cancel" }
"dialog.discard" = { "role" = "AXButton", "title" = "Discard" }
"dialog.accept" = { "role" = "AXButton", "title" = "OK" }
"dialog.replace" = { "role" = "AXButton", "title" = "Replace" }
"dialog.discard_close" = { "role" = "AXButton", "title" = "Quit Anyway" }
"dialog.export" = { "role" = "AXButton", "title" = "Export\u2026" }

[ui.actions]
"frames.select_first" = [{ click = { within = { id = "frames", role = "AXList" }, role = "AXRow", index = 0 }, physical = true }]
"frames.context_second" = [{ click = { within = { id = "frames", role = "AXList" }, role = "AXRow", index = 1 }, button = "right", physical = true }]
"results.select.hybrid" = [{ click = { within = { id = "results", role = "AXList" }, role = "AXRow", text_pattern = '^Hybrid(?:\n| ·|$)' }, physical = true }]
"results.select.weighted_average" = [{ click = { within = { id = "results", role = "AXList" }, role = "AXRow", text_pattern = '^Weighted Average(?:\n| ·|$)' }, physical = true }]

"import.folder" = [{ "click" = "import.folder" }]
"settings.open" = [{ "click" = "settings.open" }]
"viewer.fit" = [{ "click" = "viewer.fit" }]
"viewer.actual" = [{ "click" = "viewer.actual" }]
"viewer.zoom_in" = [{ "click" = "viewer.zoom_in" }]
"viewer.zoom_out" = [{ "click" = "viewer.zoom_out" }]
"viewer.fullscreen_enter" = [{ "click" = "viewer.fullscreen_enter" }]
"viewer.fullscreen_exit" = [{ "click" = "viewer.fullscreen_exit" }]
"export.viewport" = [{ "click" = "export.viewport" }]
"export.batch" = [{ "click" = "export.batch" }]
"result.crop" = [{ "click" = "result.crop" }]
"window.close" = [{ "click" = "window.close" }]
"layout.sidebar" = [{ "click" = "layout.sidebar" }]
"layout.inspector" = [{ "click" = "layout.inspector" }]
"stack.pause" = [{ "click" = "stack.pause" }]
"stack.resume" = [{ "click" = "stack.resume" }]
"stack.stop" = [{ "click" = "stack.stop" }]
"frames.remove_one" = [{ "click" = "frames.remove_one" }]
"frames.reveal" = [{ "click" = "frames.reveal" }]
"frames.select_all" = [{ "click" = "frames.select_all" }]
"frames.remove_selected" = [{ "click" = "frames.remove_selected" }]
"file.menu" = [{ "click" = "file.menu", "physical" = true }]
"recent.open" = [{ "click" = "recent.open", "physical" = true }]
"recent.clear" = [{ "click" = "recent.clear" }]
"recent.empty" = [{ "click" = "recent.empty" }]
"workspace.new" = [{ "key" = "n", "modifiers" = ["command"] }]
"viewer.next" = [{ "key" = "right", "modifiers" = ["command"] }]
"viewer.previous" = [{ "key" = "left", "modifiers" = ["command"] }]
"viewer.split_left" = [{ "key" = "left", "modifiers" = ["shift"] }]
"viewer.split_right" = [{ "key" = "right", "modifiers" = ["shift"] }]
"export.open" = [{ "click" = "export.start", "physical" = true }]
"advanced.open" = [{ "click" = "advanced" }]

[ui.choices]
"alignment" = { "off" = "Off", "translation" = "Shift only", "euclidean" = "Shift + rotation", "similarity" = "Standard", "affine" = "Full affine", "breathing" = "Focus breathing" }
"settings.theme" = { "dark" = "Dark", "light" = "Light", "system" = "Match system" }
"settings.device_mode" = { "gpu" = "Always GPU", "auto" = "Automatic (recommended)", "cpu" = "Always CPU" }
"export.format" = { "tif" = "TIFF (.tif)", "png" = "PNG (.png)", "jpg" = "JPEG (.jpg)", "exr" = "OpenEXR (.exr)" }
"export.depth" = { "8" = "8-bit", "16" = "16-bit", "float32" = "32-bit float" }

[ui.observations]
"source_total" = { selector = { id = "status" }, attribute = "value", pattern = 'frame \d+ of (\d+)', type = "integer" }
"frame_count" = { count = { role = "AXRow" }, within = { id = "frames", role = "AXList" }, direct = true, empty_when = { role = "AXStaticText", value = "No frames yet.\nDrop images or a folder here." } }
"result_count" = { count = { role = "AXRow" }, within = { id = "results", role = "AXList" }, direct = true }
"result_cropped" = { selector = { id = "status" }, pattern = 'Cropped the empty borders' }
"about.version" = { selector = { id = "about.version" }, attribute = "description" }

"selected_method" = { "selected" = { "laplacian" = { "id" = "method.laplacian" }, "hybrid" = { "id" = "method.hybrid" }, "weighted_average" = { "id" = "method.weighted_average" }, "depth_map" = { "id" = "method.depth_map" }, "exposure_fusion" = { "id" = "method.exposure_fusion" } } }
"source_index" = { "selector" = { "id" = "status" }, "attribute" = "value", "pattern" = 'frame (\d+) of', "type" = "integer" }
"selected_result_method" = { "selector" = { "id" = "status" }, "attribute" = "value", "pattern" = "^(.+?) result", "values" = { "Hybrid" = "hybrid", "Weighted Average" = "weighted_average", "Laplacian" = "laplacian", "Depth Map" = "depth_map", "Exposure Fusion" = "exposure_fusion" } }

[ui.initial_values]
"parameter.kernel" = 3
"parameter.levels" = 4
"parameter.contrast" = 0

[ui.advanced_values]
"parameter.kernel" = 5

[ui.settings_choices]
"settings.theme" = ["dark", "light", "system", "dark"]
"settings.device_mode" = ["gpu", "auto", "cpu"]
