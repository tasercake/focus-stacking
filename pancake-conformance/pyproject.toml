[project]
name = "pancake-conformance"
version = "0.2.0"
description = "Pancake-conformance focus-stacking conformance suite."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "tifffile>=2025.1.10",
  "imagecodecs>=2025.3.30",
  "coverage>=7.17.3",
  "openexr>=3.5.4",
  "pypng>=0.20220715.0",
  "scipy>=1.18.1"
]

[project.scripts]
pancake-conformance = "pancake_conformance:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pancake_conformance"]
source-exclude = ["**/.venv/**", "**/artifacts/**", "**/dist/**", "**/build/**", "**/.pytest_cache/**", "**/.ruff_cache/**"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
